name: Propard Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: propard-frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: propard-frontend/package-lock.json

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances du frontend
        run: npm install

      - name: Installer Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/ios @capacitor/push-notifications@8.1.2

      - name: Créer la configuration Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "site.propard",
            "appName": "Propard",
            "webDir": "dist",
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "banner", "list"]
              }
            }
          }
          EOF

      - name: Construire Propard
        run: npm run build

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Donner les permissions à Gradle
        working-directory: propard-frontend/android
        run: chmod +x gradlew

      - name: Compiler l'APK
        working-directory: propard-frontend/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: propard-android-debug
          path: propard-frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier le projet Android
        uses: actions/upload-artifact@v4
        with:
          name: propard-android-project
          path: propard-frontend/android
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: propard-frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: propard-frontend/package-lock.json

      - name: Installer les dépendances du frontend
        run: npm install

      - name: Installer Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/ios @capacitor/push-notifications@8.1.2

      - name: Créer la configuration Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "site.propard",
            "appName": "Propard",
            "webDir": "dist",
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "banner", "list"]
              }
            }
          }
          EOF

      - name: Construire Propard
        run: npm run build

      - name: Ajouter iOS avec Swift Package Manager
        run: npx cap add ios --packagemanager SPM

      - name: Configurer l'audio iOS pour les appels en arrière-plan
        working-directory: propard-frontend
        run: python3 scripts/configure_ios_audio.py

      - name: Synchroniser iOS
        run: npx cap sync ios

      - name: Configurer les notifications Push iOS
        working-directory: propard-frontend
        run: python3 scripts/configure_ios_push.py

      - name: Compiler pour iPhone
        working-directory: propard-frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/PropardDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Créer l'IPA non signée
        working-directory: propard-frontend
        run: |
          mkdir -p ipa/Payload
          cp -R "$RUNNER_TEMP/PropardDerivedData/Build/Products/Release-iphoneos/App.app" ipa/Payload/Propard.app
          cd ipa
          zip -r ../Propard-unsigned.ipa Payload

      - name: Publier l'IPA non signée
        uses: actions/upload-artifact@v4
        with:
          name: propard-ios-unsigned-ipa
          path: propard-frontend/Propard-unsigned.ipa
          if-no-files-found: error

      - name: Publier le projet iOS
        uses: actions/upload-artifact@v4
        with:
          name: propard-ios-project
          path: propard-frontend/ios
          if-no-files-found: error
name: Propard final account lifecycle checks

on:
  push:
    branches:
      - feature/propard-full-upgrade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propard-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: propard-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + "; fix=" + JSON.stringify(item.fixAvailable));'
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Run tests
        run: npm test

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propard-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: propard-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + "; fix=" + JSON.stringify(item.fixAvailable));'
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propard-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: propard-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + "; fix=" + JSON.stringify(item.fixAvailable));'
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Build
        run: npm run build
